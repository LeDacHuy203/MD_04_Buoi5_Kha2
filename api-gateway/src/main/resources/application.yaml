server:
  port: 8080

spring:
  application:
    name: Api_Gateway
  cloud:
    gateway:
      routes:
        - id: customer-service-route
          uri: lb://CustomerService
          predicates:
            - Path=/api/v1/auth/**, /api/v1/customers/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
